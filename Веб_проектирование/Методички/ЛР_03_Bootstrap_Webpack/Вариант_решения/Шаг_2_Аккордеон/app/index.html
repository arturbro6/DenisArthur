<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учебная выборочная сборка</title>
  <link rel="stylesheet" href="./dist/styles.css">
  <script defer src="./dist/bundle.js"></script>
</head>
<body>
<main class="container lab-page">
  <h1 class="lab-title">Выборочная сборка Bootstrap 5</h1>
  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4"><div class="grid-cell">Первый блок</div></div>
    <div class="col-12 col-md-6 col-lg-4"><div class="grid-cell">Второй блок</div></div>
    <div class="col-12 col-md-6 col-lg-4"><div class="grid-cell">Третий блок</div></div>
  </div>
  <section class="faq" aria-labelledby="faq-title">
    <h2 id="faq-title">Вопросы</h2>
    <div class="accordion" id="faq">
      <div class="accordion-item">
        <h3 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse"
                  data-bs-target="#answer-one" aria-expanded="true" aria-controls="answer-one">
            Зачем отдельный CSS-файл?
          </button>
        </h3>
        <div id="answer-one" class="accordion-collapse collapse show" data-bs-parent="#faq">
          <div class="accordion-body">Так требует задача; CSS извлекает MiniCssExtractPlugin.</div>
        </div>
      </div>
      <div class="accordion-item">
        <h3 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                  data-bs-target="#answer-two" aria-expanded="false" aria-controls="answer-two">
            Почему нельзя подключить весь Bootstrap одной строкой?
          </button>
        </h3>
        <div id="answer-two" class="accordion-collapse collapse" data-bs-parent="#faq">
          <div class="accordion-body">Цель работы — понять зависимости и собрать только нужные части.</div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
